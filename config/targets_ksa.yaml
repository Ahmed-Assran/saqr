      scrape_mode: "replies_and_mentions"
    - handle: "AwaedApp"
      name: "Awaed (تطبيق عوائد)"
      url: "https://awaed.capital/"
      scrape_mode: "replies_and_mentions"
    - handle: "getbaraka"
      name: "Baraka (تطبيق بركة)"
      url: "https://getbaraka.com/ar/"
      scrape_mode: "replies_and_mentions"
    - handle: "SNBCapital"
      name: "SNB Capital (الأهلي المالية - التداول الدولي)"
      url: "https://snbcapital.com/ar/global-trading"
      scrape_mode: "replies_and_mentions"
    - handle: "RiyadCapital"
