# config/targets_ksa.yaml
schedule:
  timezone: "Asia/Riyadh"
  start_time: "10:30"
  deadline_export_time: "12:00"
  daily_lead_target: 50

x_search_queries:
  # Category 1: Options Trading Intent (عقود الأوبشن)
  options_intent:
    - '(أوبشن OR الاوبشن OR "عقود الخيارات" OR "عقود الاوبشن") (السوق_الأمريكي OR الأسهم_الأمريكية OR دراية OR سهم) -is:retweet'
    - '(#أوبشن OR #الاوبشن) (كول OR بوت OR عقود OR تداول) lang:ar -is:retweet'
    - '("كيف اشتري اوبشن" OR "تعليم الاوبشن" OR "توصيات اوبشن" OR "قروب اوبشن") lang:ar -is:retweet'

  # Category 2: Sharia / Halal US Stocks Intent (الأسهم النقية والشرعية)
  sharia_halal_intent:
    - '(#الأسهم_النقية OR #الأسهم_الحلال OR "الاسهم الامريكية النقية" OR "شرعية السهم") lang:ar -is:retweet'
    - '("هل سهم" OR "حكم سهم" OR "نقاوة سهم" OR "تطهير السهم") (امريكي OR $NVDA OR $TSLA OR $AAPL OR $AMD OR $PLTR) lang:ar -is:retweet'

  # Category 3: Active Day & Swing Trading Intent (المضاربة اليومية واللحظية)
  day_swing_intent:
    - '(#الأسهم_الأمريكية OR #السوق_الأمريكي OR #تداول_الأسهم_الأمريكية) (دخول OR اهداف OR مقاومة OR دعم OR مضاربة) -is:retweet'
    - '("وش رايكم في سهم" OR "سهم للدخول" OR "فرصة في السوق الامريكي" OR "توصيات السوق الامريكي") lang:ar -is:retweet'

  # Category 4: High-Velocity US Tech Cashtags with Arabic Context
  us_tech_cashtags_ar:
    - '($NVDA OR $TSLA OR $AAPL OR $MSFT OR $AMD) (سهم OR شراء OR دخول OR هدف OR اوبشن OR محفظة) lang:ar -is:retweet'
    - '($PLTR OR $META OR $AMZN OR $GOOGL OR $COIN OR $MSTR OR $SPY OR $QQQ) (سهم OR شراء OR دخول OR اوبشن) lang:ar -is:retweet'

  # Category 5: KSA Broker & Recommendation Seekers (الباحثون عن وسطاء وقروبات)
  broker_and_group_seekers:
    - '("دراية جلوبل" OR "تطبيق سهم" OR "سهم كابيتال" OR "تطبيق عوائد" OR "تطبيق بركة") (عمولة OR رايكم OR افضل OR السوق الامريكي) lang:ar -is:retweet'
    - '("افضل وسيط للسوق الامريكي" OR "افضل منصة للاسهم الامريكية" OR "قروب توصيات امريكي" OR "القروبات المدفوعة") lang:ar -is:retweet'

